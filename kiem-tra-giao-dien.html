<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem trước giao diện | Bản tin</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8edf1;color:#173546;font:15px system-ui,sans-serif}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:18px;margin:0}select{font:inherit;padding:8px;border:1px solid #bbc9d1;border-radius:8px;background:white}iframe{display:block;border:0;width:360px;height:760px;border-radius:16px;background:white;box-shadow:0 8px 32px #18374626}.frame{width:max-content;padding:8px;border:1px solid #bbc9d1;border-radius:24px;background:#d2dce3}
</style>
</head>
<body>
<header><h1>Xem trước giao diện</h1><label for="screen-width">Chiều rộng màn hình</label><select id="screen-width"><option value="280">280 px</option><option value="320">320 px</option><option value="360" selected>360 px</option><option value="390">390 px</option><option value="414">414 px</option><option value="600">600 px</option><option value="768">768 px</option><option value="920">920 px</option><option value="1024">1024 px</option><option value="1366">1366 px</option></select></header>
<div class="frame"><iframe id="app-preview" title="Giao diện ứng dụng bản tin" src="./index.html"></iframe></div>
<script>document.querySelector('#screen-width').addEventListener('change',e=>{document.querySelector('#app-preview').style.width=e.target.value+'px';});</script>
</body>
</html>
